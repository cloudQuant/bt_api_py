# A second strategy identity with its own account-a01 registration scope.
config_schema_version: 6
process_role: strategy_client
registration:
  strategy_ref: strategy-s002
clients:
  gateway:
    config_schema_version: 1
    settings:
      bindings:
        - mount: store.account
          account_ref: account-a01
          service_id: account-a01
          instance_id: account-gateway
          scope_ref: account-a01
          transport_ref: account-a01-zmq
communication:
  config_schema_version: 1
  profiles:
    account-a01-zmq:
      backend: zmq
      config_schema_version: 1
      endpoints:
        rpc_connect: tcp://127.0.0.1:7601
      security_profile_ref: account-a01-client-s002
