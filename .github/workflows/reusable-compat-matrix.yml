name: Reusable Compatibility Matrix

on:
  workflow_call:

env:
  SMOKE_TEST_PATHS: >-
    tests/test_bt_api_quality.py
    tests/test_forwarding_schema.py
    tests/test_forwarding_bus_router_client.py
    tests/test_monitoring_contracts.py

jobs:
  matrix:
    name: Compatibility (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # D1 (docs/governance/decision-log.md): 3.11-3.13 blocking; 3.14 non-blocking canary.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.14"
            canary: true

    continue-on-error: ${{ matrix.canary == true }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Checkout pinned base source
        run: git submodule update --init --depth 1 -- bt_api/bt_api_base

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and install parent-pinned base wheel
        run: >-
          python scripts/ci/base_source_pin.py
          --wheel-dir "${{ runner.temp }}/bt_api_base_wheelhouse"

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run cross-platform compatibility smoke suite
        env:
          SKIP_LIVE_TESTS: "true"
        run: pytest $SMOKE_TEST_PATHS -q
