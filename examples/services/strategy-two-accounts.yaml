# One strategy process with two independently authorized account-read routes.
config_schema_version: 6
process_role: strategy_client
registration:
  strategy_ref: strategy-s001
clients:
  gateway:
    config_schema_version: 1
    settings:
      bindings:
        - mount: store.market
          service_id: market-main
          instance_id: market-gateway
          scope_ref: public-market-access
          transport_ref: market-zmq
        - mount: store.account
          account_ref: account-a01
          service_id: account-a01
          instance_id: account-gateway
          scope_ref: account-a01
          transport_ref: account-a01-zmq
        - mount: store.account
          account_ref: account-b02
          service_id: account-b02
          instance_id: account-gateway-b02
          scope_ref: account-b02
          transport_ref: account-b02-zmq
communication:
  config_schema_version: 1
  profiles:
    market-zmq:
      backend: zmq
      config_schema_version: 1
      endpoints:
        rpc_connect: tcp://127.0.0.1:7600
        market_connect: tcp://127.0.0.1:7602
      security_profile_ref: local-market-client
    account-a01-zmq:
      backend: zmq
      config_schema_version: 1
      endpoints:
        rpc_connect: tcp://127.0.0.1:7601
      security_profile_ref: account-a01-client
    account-b02-zmq:
      backend: zmq
      config_schema_version: 1
      endpoints:
        rpc_connect: tcp://127.0.0.1:7611
      security_profile_ref: account-b02-client
