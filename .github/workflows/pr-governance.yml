name: PR Governance

on:
  pull_request:
    branches: [dev, master, code-optimization]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# Read-only by design: no label writes, no secrets beyond the read-only
# GITHUB_TOKEN, no pull_request_target. Strictness is controlled by the
# repo variable PR_GOVERNANCE_STRICT after the observation period (plan M4).
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    name: PR Governance / Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Roll out in two phases: deploy collector/validator to dev, master, and
      # code-optimization while PR_GOVERNANCE_STRICT=false. Then enable this
      # trusted checkout and observe each branch; strict=true after that observation.
      # Missing scripts or commit objects must fail closed; never fall back to PR-head scripts.
      - name: Checkout trusted governance source
        id: checkout-governance
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: governance-source
          persist-credentials: false

      - name: Checkout PR source
        id: checkout-pr
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify PR diff objects
        id: verify-objects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        working-directory: pr-source
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Collect PR context
        id: collect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}
        working-directory: pr-source
        run: >-
          python ../governance-source/scripts/ci/collect_pr_governance_context.py
          --output "$RUNNER_TEMP/pr-context.json"

      - name: Validate governance metadata
        id: validate
        env:
          STRICT_MODE: ${{ vars.PR_GOVERNANCE_STRICT == 'true' && '--strict' || '' }}
        working-directory: governance-source
        run: |
          set +e
          python scripts/ci/validate_pr_governance.py --context "$RUNNER_TEMP/pr-context.json" $STRICT_MODE | tee "$RUNNER_TEMP/pr-result.txt"
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## PR Governance / Summary"
            echo ""
            echo "- Target branch: \`${{ github.event.pull_request.base.ref }}\`"
            echo "- Mode: ${{ vars.PR_GOVERNANCE_STRICT == 'true' && 'strict' || 'report-only' }}"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/pr-result.txt" 2>/dev/null || echo "(validator did not produce output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce in strict mode
        if: always() && steps.validate.outputs.exitcode != '0' && vars.PR_GOVERNANCE_STRICT == 'true'
        run: |
          echo "::error::PR governance violations found (strict mode)"
          exit 1
