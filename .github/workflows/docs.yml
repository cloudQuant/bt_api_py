name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - '.readthedocs.yaml'
      - 'docs/requirements.txt'
      - '.github/workflows/docs.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'bt_api_py/**'
      - 'scripts/generate_exchange_support_docs.py'
      - 'scripts/ci/check_docs_contract.py'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - '.readthedocs.yaml'
      - 'docs/requirements.txt'
      - '.github/workflows/docs.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'bt_api_py/**'
      - 'scripts/generate_exchange_support_docs.py'
      - 'scripts/ci/check_docs_contract.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install doc dependencies
        run: python -m pip install --upgrade pip -r docs/requirements.txt

      - name: Install package (needed by mkdocstrings)
        run: python -m pip install -e .

      - name: Check generated docs are current
        run: python scripts/generate_exchange_support_docs.py --check

      - name: Check docs contract
        run: python scripts/ci/check_docs_contract.py

      - name: Build docs (strict)
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
