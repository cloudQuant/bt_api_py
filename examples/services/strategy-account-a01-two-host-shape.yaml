# Endpoint-shape example only. Match rpc_connect to the service's real reachable address.
config_schema_version: 6
process_role: strategy_client
registration:
  strategy_ref: strategy-s001
clients:
  gateway:
    config_schema_version: 1
    settings:
      bindings:
        - mount: store.account
          account_ref: account-a01
          service_id: account-a01
          instance_id: account-gateway
          scope_ref: account-a01
          transport_ref: account-a01-zmq
communication:
  config_schema_version: 1
  profiles:
    account-a01-zmq:
      backend: zmq
      config_schema_version: 1
      endpoints:
        rpc_connect: tcp://192.0.2.10:7601
      security_profile_ref: account-a01-client
